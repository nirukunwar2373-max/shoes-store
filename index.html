<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StepUp Shoe Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }
        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
        nav {
            background-color: #444;
            text-align: center;
            padding: 10px;
        }
        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            padding: 20px;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .product {
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 200px;
            text-align: center;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        .product img {
            width: 100%;
            border-radius: 10px;
        }
        button {
            background-color: #222;
            border: none;
            color: white;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #555;
        }
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>👟 StepUp Shoe Store</h1>
    <p>Find your perfect pair</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Shop</a>
    <a href="#">Contact</a>
</nav>

<div class="container">
    <h2>Our Collection</h2>
    <div class="products">

        <div class="product">
            <img src="https://via.placeholder.com/300x200?text=Sneakers" alt="Sneakers">
            <h3>Classic Sneakers</h3>
            <p>$40</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200?text=Running+Shoes" alt="Running Shoes">
            <h3>Running Shoes</h3>
            <p>$60</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200?text=Boots" alt="Boots">
            <h3>Leather Boots</h3>
            <p>$80</p>
            <button>Buy Now</button>
        </div>

    </div>
</div>

<footer>
    <p>© 2026 StepUp Shoe Store</p>
</footer>

</body>
</html>

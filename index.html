<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StyleHub Accessories</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f9f9f9;
        }
        header {
            background-color: #6a5acd;
            color: white;
            text-align: center;
            padding: 20px;
        }
        nav {
            background-color: #333;
            text-align: center;
            padding: 10px;
        }
        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            padding: 20px;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .product {
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 200px;
            text-align: center;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        .product img {
            width: 100%;
            border-radius: 10px;
        }
        button {
            background-color: #6a5acd;
            border: none;
            color: white;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #5848c2;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>👜 StyleHub Accessories</h1>
    <p>Complete your look with style</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Shop</a>
    <a href="#">Contact</a>
</nav>

<div class="container">
    <h2>Our Collection</h2>
    <div class="products">

        <div class="product">
            <img src="https://via.placeholder.com/300x200?text=Watch" alt="Watch">
            <h3>Elegant Watch</h3>
            <p>$50</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200?text=Sunglasses" alt="Sunglasses">
            <h3>Stylish Sunglasses</h3>
            <p>$25</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200?text=Handbag" alt="Handbag">
            <h3>Trendy Handbag</h3>
            <p>$70</p>
            <button>Buy Now</button>
        </div>

    </div>
</div>

<footer>
    <p>© 2026 StyleHub Accessories</p>
</footer>

</body>
</html>
